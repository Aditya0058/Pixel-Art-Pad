<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art Pad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content">
        <h1>Pixel Art Pad</h1>
        <br>
        <div id="color-palette">
            <button data-color="#000000" class="color-btn black">Black</button>
            <button data-color="#ffffff" class="color-btn white">White</button>
            <button data-color="#ff0000" class="color-btn red">Red</button>
            <button data-color="#0000ff" class="color-btn blue">Blue</button>
            <button data-color="#00ff00" class="color-btn green">Green</button>
            <label for="colorPicker">Choose a color:</label>
            <input id="custom-color" type="color" placeholder="Custom">
            
        </div>
        <div id="pixel-grid"></div>
        <div class="extra-ctrls">
            <button id="reset-btn">Reset Art Pad</button>
            <button class="black-canvas">Make Entire canvas Black</button>
        </div> 
        <!-- <div class="reder-test">
            <button id="print-btn"">Print</button>
        </div> -->
    </div>
    <script src="script.js"></script>
</body>
</html>
